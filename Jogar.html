      </div>

      <div class="container">
        <label for="uname"><b>Nome de utilizador</b></label>
        <input type="text" placeholder="Insere o nome de utilizador" name="uname" required>
        <br>
        <label for="psw1"><b>Password</b></label>
        <input type="password" placeholder="Insere a password" name="psw1" required>
        
        <button type="button"  class="loginbtn" id="btn_login" >Login</button>
        
      </div>
    
    </form>
  </div>



  <div id="id02" class="modal">

    <form class="modal-content" name="signup-form" id="spform">

        <span onclick="document.getElementById('id02').style.display='none'" class="close" id="close-signup" title="Close Modal">&times;</span>
        <h1>Sign Up</h1>
        <p>Preenche os espaços em branco para criar uma conta</p>
        <hr class="hr-signup">
        <label for="email"><b>Nome de Utilizador</b></label>
        <input type="text" placeholder="Insere o nome de utilizador" name="email" required>

        <label for="psw"><b>Password</b></label>
        <input type="password" placeholder="Insere a password" name="psw" required>

        <label for="psw-repeat"><b>Repete a Password</b></label>
        <input type="password" placeholder="Repete a Password" name="psw-repeat" required>

        <label for="idade"><b>Introduz a tua idade</b></label>
        <input type="text" placeholder="Idade" name="idade" required>
        <p>Género :</p>
        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label><br>
        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label><br>
        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label>
      
        

      

        <div class="clearfix">
          <button type="button" onclick="document.getElementById('id02').style.display='none'" class="cancelbtn">Cancelar</button>
          <button type="button" onclick="document.getElementById('id02').style.display='none'" class="signupbtn" id="btn_signup">Sign Up</button>
        </div>
      </div>
    </form>
  </div>
